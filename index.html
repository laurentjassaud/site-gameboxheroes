<style>
/* ==========================================================================
   GameBoxHeroes — page d'attente
   Page autonome : reprend les jetons de assets/css/style.css (couleurs,
   polices, unite --u, courbes) sans charger toute la feuille du site.
   ========================================================================== */

:root {
  --white: #fff;
  --black: #000;
  --cream: #fbfbf8;
  --rule: #e6e6df;
  --muted: #6b6b6b;
  --red: #ff0000;

  --font: 'Red Hat Text', system-ui, sans-serif;
  --font-display: 'Red Hat Display', 'Red Hat Text', system-ui, sans-serif;

  /* 1 px de maquette (1920), plafonne a 1440 px CSS comme sur le site */
  --max: 1440px;
  --u: calc(min(100vw, var(--max)) / 1920);

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-breathe: cubic-bezier(0.45, 0, 0.55, 1);
}

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; background: var(--cream); }

body {
  display: grid;
  grid-template-rows: 1fr auto;
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  background: var(--cream);
  color: var(--black);
  font-family: var(--font);
  font-size: max(16px, calc(16 * var(--u)));
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

h1, p { margin: 0; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
::selection { background: var(--red); color: var(--white); }

/* ---------- Bloc central ---------- */

.hold {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(80 * var(--u)) 16px;
  text-align: center;
}

/* ---------- Logo ---------- */

.logo {
  display: block;
  width: max(112px, calc(200 * var(--u)));
  aspect-ratio: 139 / 156;
}

.logo svg { display: block; width: 100%; height: 100%; overflow: visible; }

.logo path {
  transform-box: fill-box;
  transform-origin: center;
}

/* Entree : l'hexagone se pose, puis le monogramme se referme depuis les
   quatre coins (inverse de l'ecart au survol). fill-mode backwards : une fois
   l'entree finie, l'animation ne fige plus transform et le survol reprend. */
.logo__hex { animation: hex-in 0.7s var(--ease-out) backwards; }

.logo__mark path {
  animation: piece-in 0.9s var(--ease-out) calc(0.22s + var(--i) * 0.08s) backwards;
  transition:
    transform 0.84s var(--ease-out) calc(0.16s + var(--i) * 0.08s),
    opacity 0.84s var(--ease-out) calc(0.16s + var(--i) * 0.08s);
}

.logo__mark path:nth-child(1) { --dx: 4.2px;  --dy: -4.2px; }
.logo__mark path:nth-child(2) { --dx: -4.2px; --dy: -4.2px; }
.logo__mark path:nth-child(3) { --dx: 4.2px;  --dy: 4.2px; }
.logo__mark path:nth-child(4) { --dx: -4.2px; --dy: 4.2px; }

/* Survol (comme dans l'en-tete du site) : le monogramme s'ecarte, le nom
   "Game Box Heroes" monte lettre a lettre. Sortie courte, sans delai. */
.logo__name path {
  opacity: 0;
  transform: translateY(5px);
  transition: transform 0.28s var(--ease-out), opacity 0.28s var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .logo:hover .logo__mark path {
    opacity: 0;
    transform: translate(var(--dx), var(--dy)) scale(0.9);
    transition: transform 0.4s var(--ease-out), opacity 0.4s var(--ease-out);
  }

  .logo:hover .logo__name path {
    opacity: 1;
    transform: none;
    transition:
      transform 0.72s var(--ease-out) calc(0.18s + var(--i) * 0.044s),
      opacity 0.72s var(--ease-out) calc(0.18s + var(--i) * 0.044s);
  }
}

/* ---------- Mot-symbole et slogan ---------- */

.wordmark {
  margin-top: calc(56 * var(--u));
  font-family: var(--font-display);
  font-size: min(11.4vw, max(64px, calc(150 * var(--u))));
  line-height: 0.95;
  font-weight: 800;
  letter-spacing: -0.025em;
  white-space: nowrap;
  animation: fade-up 0.7s var(--ease-out) 0.3s backwards;
}

.wordmark span { color: var(--red); }

.tagline {
  margin-top: calc(22 * var(--u));
  font-family: var(--font-display);
  font-size: max(19px, calc(39 * var(--u)));
  line-height: 1.1;
  font-weight: 300;
  letter-spacing: -0.01em;
  text-wrap: balance;
  animation: fade-up 0.7s var(--ease-out) 0.38s backwards;
}

.tagline strong { font-weight: 700; }

/* Filet gris du site (4 px), trace depuis le centre */
.rule {
  width: max(96px, calc(160 * var(--u)));
  height: 4px;
  margin-block: calc(56 * var(--u)) calc(48 * var(--u));
  background: var(--rule);
  animation: draw 0.9s var(--ease-in-out) 0.5s backwards;
}

/* ---------- Etat ---------- */

.status {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-display);
  font-size: max(19px, calc(30 * var(--u)));
  line-height: 1.2;
  font-weight: 700;
  animation: fade-up 0.7s var(--ease-out) 0.62s backwards;
}

/* Trois hexagones rouges (puce du site) qui s'allument a tour de role */
.pulse {
  display: inline-flex;
  gap: 5px;
  flex: none;
}

.pulse svg {
  display: block;
  width: max(13px, calc(18 * var(--u)));
  height: auto;
  fill: var(--red);
  animation: hex-pulse 1.5s var(--ease-breathe) calc(1.1s + var(--i) * 0.18s) infinite both;
}

.status__text {
  margin-top: 10px;
  font-size: max(17px, calc(24 * var(--u)));
  line-height: 1.35;
  text-wrap: balance;
  animation: fade-up 0.7s var(--ease-out) 0.7s backwards;
}

.status__en {
  margin-top: 6px;
  color: var(--muted);
  font-size: max(14px, calc(16 * var(--u)));
  font-weight: 300;
  animation: fade-in 0.7s var(--ease-out) 0.85s backwards;
}

/* ---------- Pied ---------- */

.foot {
  padding: 0 16px max(16px, calc(28 * var(--u)));
  text-align: center;
  color: var(--muted);
  font-size: max(12px, calc(13 * var(--u)));
  font-weight: 300;
  animation: fade-in 0.7s ease 1s backwards;
}

/* ---------- Animations ---------- */

@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(12px); } }
@keyframes draw { from { transform: scaleX(0); } }
@keyframes hex-in { from { opacity: 0; transform: scale(0.92); } }
@keyframes piece-in { from { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.9); } }
@keyframes hex-pulse {
  0%, 100% { opacity: 0.25; transform: scale(0.85); }
  35% { opacity: 1; transform: none; }
}

/* Mouvement reduit : on garde les fondus, on retire les deplacements */
@media (prefers-reduced-motion: reduce) {
  @keyframes fade-up { from { opacity: 0; } }
  @keyframes draw { from { opacity: 0; } }
  @keyframes hex-in { from { opacity: 0; } }
  @keyframes piece-in { from { opacity: 0; } }
  @keyframes hex-pulse {
    0%, 100% { opacity: 0.3; }
    35% { opacity: 1; }
  }

  .pulse svg { animation-duration: 2.4s; }
  .logo path { transition-property: opacity !important; transition-delay: 0s !important; }
}

@media (max-width: 480px) {
  .hold { padding-block: 48px; }
  .wordmark { margin-top: 32px; }
  .tagline { margin-top: 14px; }
  .rule { margin-block: 36px 30px; }
}
</style>
