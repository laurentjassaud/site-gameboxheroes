<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Image de partage (Open Graph) — 1200 x 630</title>
<!-- Source des images assets/og-fr.jpg et assets/og-en.jpg : ouvrir cette page
     dans une fenetre de 1200 x 630 (?lang=en pour l'anglais) et la capturer. -->
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #fbfbf8;
    color: #000;
    font-family: 'Red Hat Display', sans-serif;
  }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 108px; margin-bottom: 40px; }
  h1 { font-size: 70px; line-height: 0.95; font-weight: 800; letter-spacing: -0.025em; }
  h1 span { color: #f00; }
  p { margin-top: 26px; font-size: 38px; line-height: 1.12; font-weight: 300; letter-spacing: -0.01em; }
  p strong { font-weight: 700; }
  small { margin-top: 34px; font-size: 22px; font-weight: 400; color: #6b6b6b; }
  .covers { position: absolute; right: -40px; top: 0; bottom: 0; width: 600px; }
  .covers img { position: absolute; width: 270px; height: 360px; object-fit: cover; box-shadow: 0 24px 50px -22px rgba(0, 0, 0, 0.55); }
  .covers img:nth-child(1) { left: 20px; top: 60px; transform: rotate(-6deg); }
  .covers img:nth-child(2) { left: 290px; top: 30px; transform: rotate(5deg); }
  .covers img:nth-child(3) { left: 150px; top: 250px; transform: rotate(-1deg); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #f00; }
</style>
</head>
<body>
  <div class="covers">
    <img src="../assets/home/prep-arnhem.webp" alt="">
    <img src="../assets/home/prep-carrier.webp" alt="">
    <img src="../assets/home/prep-ambush.webp" alt="">
  </div>
  <div class="text">
    <img class="logo" src="../assets/logo-mark.svg" alt="">
    <h1>Game<span>Box</span>Heroes</h1>
    <p data-fr>Les <strong>boîtes</strong> de jeux des classiques du <strong>wargame</strong></p>
    <p data-en hidden>The game <strong>boxes</strong> of classic <strong>wargames</strong></p>
    <small data-fr>En solo ou à deux, en ligne</small>
    <small data-en hidden>Solo or head-to-head, online</small>
  </div>
  <div class="bar"></div>
  <script>
    if (new URLSearchParams(location.search).get('lang') === 'en') {
      document.querySelectorAll('[data-fr]').forEach((el) => { el.hidden = true; });
      document.querySelectorAll('[data-en]').forEach((el) => { el.hidden = false; });
    }
  </script>
</body>
</html>
